# Teclas da janela da captura (carregado pelo comando ps5)
# Muitos jogos de console rodam a 30 fps numa saída de 60: cada quadro chega duas vezes.
# 3 = remove as cópias (mpdecimate): só os quadros únicos (padrão ao abrir)
# 6 = mostra tudo que a placa entrega (com cópias)
# q = fecha. Encerra à força porque, com o lsfg-vk carregado, o mpv às vezes trava ao fechar normalmente.
3 vf set lavfi=[mpdecimate] ; show-text "sem copias (so quadros unicos)" 1500
6 vf clr "" ; show-text "tudo da placa (com copias)" 1500
q expand-properties run "/bin/kill" "-9" "${pid}"
